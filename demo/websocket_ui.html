<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCN Action Recognition - WebSocket</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 20px; 
            margin: 0; 
            min-height: 100vh;
        }
        h2 { margin-top: 0; font-weight: 600; color: #f8fafc; }
        .controls { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 25px; 
            align-items: center; 
            flex-wrap: wrap; 
            justify-content: center; 
            background: #1e293b; 
            padding: 15px 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        button, select, input[type="file"] { 
            padding: 10px 16px; 
            border-radius: 8px; 
            border: none; 
            font-size: 14px; 
            font-weight: 500;
            outline: none;
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        button { background: #3b82f6; color: white; }
        button:hover:not(:disabled) { background: #2563eb; transform: translateY(-1px); }
        button:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        select { background: #334155; color: white; }
        input[type="file"] { background: #334155; color: white; display: none; }
        input[type="file"]::file-selector-button {
            padding: 8px 12px; border-radius: 6px; border: none;
            background: #475569; color: white; cursor: pointer; margin-right: 10px;
        }
        
        .container { 
            position: relative; 
            display: inline-block; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); 
            border-radius: 12px; 
            overflow: hidden; 
            background: #000; 
            border: 1px solid #334155;
        }
        video { display: none; } /* Chỉ dùng để extract frame, hiển thị bằng canvas */
        canvas { 
            display: block; 
            max-width: 100%; 
            height: auto; 
        }
        #status { margin-top: 15px; color: #94a3b8; font-size: 14px; }
        #stats { 
            position: absolute; 
            top: 15px; left: 15px; 
            background: rgba(15, 23, 42, 0.8); 
            color: #38bdf8;
            padding: 6px 12px; 
            border-radius: 6px; 
            font-family: monospace; 
            font-size: 13px; 
            pointer-events: none; 
            backdrop-filter: blur(4px);
        }
        #result-overlay { 
            position: absolute; 
            bottom: 15px; left: 15px; 
            background: rgba(15, 23, 42, 0.85); 
            padding: 12px 20px; 
            border-radius: 10px; 
            pointer-events: none; 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #result-label { font-size: 26px; font-weight: 700; color: #10b981; margin: 0; text-transform: uppercase; letter-spacing: 1px; }
        #result-conf { font-size: 15px; color: #94a3b8; margin: 5px 0 0 0; font-weight: 500;}
        
        .backend-status {
            position: absolute;
            top: 15px; right: 15px;
            width: 12px; height: 12px;
            border-radius: 50%;
            background: #ef4444; /* offline */
        }
        .backend-status.online { background: #10b981; box-shadow: 0 0 10px #10b981; }
    </style>
</head>
<body>

    <h2>GCN Action Recognition Live</h2>

    <div class="controls">
        <select id="source-select">
            <option value="webcam">Webcam</option>
            <option value="video">File Video</option>
        </select>
        <select id="camera-select" style="display: none;"></select>
        <input type="file" id="video-file" accept="video/*">
        <button id="btn-start">🚀 Start Streaming</button>
        <button id="btn-stop" disabled>🛑 Stop</button>
    </div>

    <div class="main-layout" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 1200px;">
        <div class="container">
            <video id="video-element" playsinline muted loop></video>
            <!-- Canvas dùng chung cho webcam / video để vẽ frames / kết quả -->
            <canvas id="canvas-element" width="640" height="480"></canvas>
            <div id="stats">FPS: 0 | Pose Conf: 0%</div>
            <div class="backend-status" id="ws-indicator" title="WebSocket Status"></div>
            
            <div id="result-overlay">
                <p id="result-label">WAITING</p>
                <p id="result-conf">0.0%</p>
            </div>
        </div>

        <div class="log-container" style="background: #1e293b; padding: 15px; border-radius: 12px; width: 300px; max-height: 480px; overflow-y: auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); border: 1px solid #334155;">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 16px; color: #e2e8f0; border-bottom: 1px solid #334155; padding-bottom: 10px;">📋 Lịch sử nhận diện</h3>
            <ul id="action-log" style="list-style: none; padding: 0; margin: 0; font-size: 14px;">
                <!-- Logs sẽ được thêm vào đây -->
            </ul>
        </div>
    </div>

    <div id="status">Chưa kết nối. Nhấn Start để bắt đầu.</div>

    <script>
        const wsUrl = "ws://localhost:8000/ws/stream";
        let ws = null;
        let isProcessing = false;
        let isStreaming = false;
        let animationId = null;
        
        const video = document.getElementById("video-element");
        const canvas = document.getElementById("canvas-element");
        const ctx = canvas.getContext("2d");
        
        const sourceSelect = document.getElementById("source-select");
        const videoFileInput = document.getElementById("video-file");
        const btnStart = document.getElementById("btn-start");
        const btnStop = document.getElementById("btn-stop");
        const statusEl = document.getElementById("status");
        const statsEl = document.getElementById("stats");
        const wsIndicator = document.getElementById("ws-indicator");
        
        const resultLabel = document.getElementById("result-label");
        const resultConf = document.getElementById("result-conf");
        
        const cameraSelect = document.getElementById("camera-select");
        const actionLog = document.getElementById("action-log");
        let lastLoggedAction = "";
        let logTimeout = null;
        
        // Lấy danh sách thiết bị camera
        async function getCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                cameraSelect.innerHTML = "";
                if (videoDevices.length > 0) {
                    videoDevices.forEach((device, index) => {
                        const option = document.createElement("option");
                        option.value = device.deviceId;
                        option.text = device.label || `Camera ${index + 1}`;
                        cameraSelect.appendChild(option);
                    });
                } else {
                    const option = document.createElement("option");
                    option.text = "Không tìm thấy camera";
                    cameraSelect.appendChild(option);
                }
            } catch (err) {
                console.error("Lỗi khi lấy danh sách camera:", err);
            }
        }
        
        // Yêu cầu quyền camera lần đầu để lấy tên thiết bị
        navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
            stream.getTracks().forEach(track => track.stop());
            getCameras();
        }).catch(() => {
            console.log("Chưa cấp quyền camera");
            getCameras();
        });
        
        let frameCount = 0;
        let lastFpsTime = performance.now();
        let fps = 0;
        let currentKeypoints = [];
        
        // Connections của YOLO Pose (COCO 17)
        const edges = [
            [0,1],[0,2],[1,3],[2,4],[0,5],[0,6],
            [5,7],[7,9],[6,8],[8,10],
            [5,11],[6,12],[11,13],[13,15],[12,14],[14,16],
            [5,6],[11,12]
        ];

        // Hiển thị input file hoặc select camera
        sourceSelect.addEventListener("change", (e) => {
            if (e.target.value === "video") {
                videoFileInput.style.display = "inline-block";
                cameraSelect.style.display = "none";
            } else {
                videoFileInput.style.display = "none";
                cameraSelect.style.display = "inline-block";
                getCameras();
            }
        });
        
        // Khởi tạo UI ban đầu
        if (sourceSelect.value === "webcam") {
            cameraSelect.style.display = "inline-block";
        }
        
        function connectWebSocket() {
            return new Promise((resolve, reject) => {
                statusEl.innerText = "Đang kết nối tới server...";
                ws = new WebSocket(wsUrl);
                ws.binaryType = "blob";
                
                ws.onopen = () => {
                    statusEl.innerText = "WebSocket đã kết nối. Đang phân tích...";
                    wsIndicator.classList.add("online");
                    resolve();
                };
                
                ws.onerror = (err) => {
                    statusEl.innerText = "Lỗi kết nối WebSocket! Hãy chắc chắn backend (main.py) đang chạy trên port 8000.";
                    wsIndicator.classList.remove("online");
                    reject(err);
                };
                
                ws.onclose = () => {
                    statusEl.innerText = "WebSocket đã đóng.";
                    wsIndicator.classList.remove("online");
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    
                    // Cập nhật nhãn hành động
                    if (data.ready) {
                        const confStr = (data.confidence * 100).toFixed(1);
                        resultLabel.innerText = data.label;
                        resultConf.innerText = confStr + "%";
                        
                        let actionColor = "#eab308";
                        if (data.label === "Fall Down") {
                            actionColor = "#ef4444"; // Đỏ
                        } else if (data.label === "Walking") {
                            actionColor = "#10b981"; // Xanh lá
                        }
                        resultLabel.style.color = actionColor;
                        
                        // Ghi log hành động (lọc tránh ghi liên tục cùng 1 hành động trong thời gian ngắn)
                        if (data.confidence > 0.6 && data.label !== lastLoggedAction) {
                            const timeStr = new Date().toLocaleTimeString();
                            const li = document.createElement("li");
                            li.style.marginBottom = "10px";
                            li.style.padding = "10px";
                            li.style.background = "rgba(0,0,0,0.2)";
                            li.style.borderRadius = "8px";
                            li.style.borderLeft = `4px solid ${actionColor}`;
                            
                            li.innerHTML = `<div style="color: #94a3b8; font-size: 11px; margin-bottom: 4px;">${timeStr}</div> 
                                            <strong style="color: ${actionColor}; font-size: 15px;">${data.label}</strong> 
                                            <span style="color: #cbd5e1; font-size: 13px; float: right;">${confStr}%</span>`;
                            actionLog.prepend(li);
                            
                            lastLoggedAction = data.label;
                            if (logTimeout) clearTimeout(logTimeout);
                            logTimeout = setTimeout(() => { lastLoggedAction = ""; }, 2000); // Reset filter sau 2s
                            
                            if (actionLog.children.length > 50) {
                                actionLog.removeChild(actionLog.lastChild);
                            }
                        }

                    } else {
                        resultLabel.innerText = "WARMING UP";
                        resultLabel.style.color = "#94a3b8";
                        resultConf.innerText = "Thu thập buffer...";
                    }
                    
                    currentKeypoints = data.keypoints || [];
                    
                    // Backend xử lý xong, báo để client gửi frame tiếp theo
                    isProcessing = false;
                };
            });
        }
        
        async function startStream() {
            try {
                await connectWebSocket();
                
                if (sourceSelect.value === "webcam") {
                    // Cấu hình webcam dựa trên camera đã chọn
                    const deviceId = cameraSelect.value;
                    const constraints = { 
                        video: { width: { ideal: 640 }, height: { ideal: 480 } } 
                    };
                    if (deviceId) {
                        constraints.video.deviceId = { exact: deviceId };
                    }
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    video.srcObject = stream;
                    await video.play();
                } else {
                    if (!videoFileInput.files.length) {
                        alert("Vui lòng chọn file video!");
                        ws.close();
                        return;
                    }
                    const file = videoFileInput.files[0];
                    video.src = URL.createObjectURL(file);
                    await video.play();
                }
                
                // Đồng bộ kích thước canvas với video thực tế
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                isStreaming = true;
                btnStart.disabled = true;
                btnStop.disabled = false;
                sourceSelect.disabled = true;
                videoFileInput.disabled = true;
                
                currentKeypoints = [];
                isProcessing = false; // Bắt đầu gửi frame
                
                processFrame();
                
            } catch (err) {
                console.error(err);
                if (ws) ws.close();
            }
        }
        
        function stopStream() {
            isStreaming = false;
            if (animationId) cancelAnimationFrame(animationId);
            
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            video.pause();
            video.src = "";
            
            if (ws) ws.close();
            
            btnStart.disabled = false;
            btnStop.disabled = true;
            sourceSelect.disabled = false;
            videoFileInput.disabled = false;
            
            statsEl.innerText = "FPS: 0 | Pose Conf: 0%";
            resultLabel.innerText = "WAITING";
            resultLabel.style.color = "#10b981";
            resultConf.innerText = "0.0%";
            statusEl.innerText = "Đã dừng. Nhấn Start để chạy lại.";
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        
        function drawKeypoints() {
            if (!currentKeypoints.length) return;
            
            // Vẽ xương
            ctx.lineWidth = 3;
            ctx.strokeStyle = "rgba(16, 185, 129, 0.8)"; // Màu xanh ngọc
            for (let edge of edges) {
                const p1 = currentKeypoints[edge[0]];
                const p2 = currentKeypoints[edge[1]];
                if (p1[2] > 0.3 && p2[2] > 0.3) {
                    ctx.beginPath();
                    ctx.moveTo(p1[0], p1[1]);
                    ctx.lineTo(p2[0], p2[1]);
                    ctx.stroke();
                }
            }
            
            // Vẽ các điểm nối
            ctx.fillStyle = "#ffffff";
            for (let pt of currentKeypoints) {
                if (pt[2] > 0.3) {
                    ctx.beginPath();
                    ctx.arc(pt[0], pt[1], 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }
        }
        
        function processFrame() {
            if (!isStreaming) return;
            
            // Tính toán pose confidence trung bình
            let poseConfStr = "0%";
            if (currentKeypoints && currentKeypoints.length > 0) {
                let sumConf = 0;
                let validPoints = 0;
                for (let pt of currentKeypoints) {
                    if (pt[2] > 0) {
                        sumConf += pt[2];
                        validPoints++;
                    }
                }
                const avgConf = validPoints > 0 ? (sumConf / validPoints) * 100 : 0;
                poseConfStr = avgConf.toFixed(1) + "%";
            }

            // Đo đếm FPS
            frameCount++;
            const now = performance.now();
            if (now - lastFpsTime >= 1000) {
                fps = frameCount;
                frameCount = 0;
                lastFpsTime = now;
                statsEl.innerText = `FPS: ${fps} | Pose Conf: ${poseConfStr}`;
            }
            
            // Vẽ frame video hiện tại lên canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Vẽ đè keypoint từ kết quả trước đó
            drawKeypoints();
            
            // Chỉ gửi frame mới nếu backend đã phản hồi (không bị tắc nghẽn)
            if (!isProcessing && ws && ws.readyState === WebSocket.OPEN) {
                isProcessing = true;
                
                // Gửi dưới dạng JPEG để tối ưu băng thông
                canvas.toBlob((blob) => {
                    if (blob && ws.readyState === WebSocket.OPEN) {
                        ws.send(blob);
                    } else {
                        isProcessing = false;
                    }
                }, "image/jpeg", 0.7);
            }
            
            animationId = requestAnimationFrame(processFrame);
        }
        
        btnStart.addEventListener("click", startStream);
        btnStop.addEventListener("click", stopStream);
        
    </script>
</body>
</html>
